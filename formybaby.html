<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Valentine's Day ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.5em;
        }

        p {
            color: #444;
            font-size: 1.2em;
            margin-top: 20px;
        }

        .heart {
            font-size: 40px;
            color: #ff4d6d;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button {
            margin-top: 25px;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: #ff4d6d;
            color: white;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #Blue;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">🌷🌷🌷</div>
        <h1>Hi babyy, flowers for you po. </h1>
        <p>
            Happy Valentine's lablabbkoo! 
        </p>
        <button onclick="showLove()">Click for a Surprise</button>
    </div>

    <script>
        function showLove() {
            alert("Hi lablabb, dinako marunong magcode, kaya ito lang HAHAH. Happy Valentine's, lablabb. Mahal na mahal kitaa. Virtual flower lang muna; soon magkakasama din tayo hindi lang sa Valentine's Day. Tandaan mo yan, Leks, iloveyouuuuuu, lablabbkoo. Magmahalan lang tayo habang buhay para wala tayong problema dalawa. Hinding hindi ako magsasawa mahalin ka, babyy. Happy Valentine's Dayy. Mwamwa ka saken palagi. 😙❤️");
        }
    </script>

</body>
</html>
